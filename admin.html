<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Virtual Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --primary: #00ffae; --bg: #0b0b0b; --card: #1a1a1a; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: var(--card); padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; text-align: center; color: var(--primary); margin-bottom: 25px; }
        label { display: block; margin-top: 15px; font-size: 12px; color: #888; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; background: #000; border: 1px solid #333; border-radius: 10px; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 16px; margin-top: 25px; background: var(--primary); color: #000; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,255,174,0.3); }

        .config-box { margin-bottom: 20px; padding: 15px; border: 1px dashed #444; border-radius: 12px; display: none; }
        
        .product-list { width: 100%; max-width: 500px; margin-top: 5px; padding-bottom: 100px; }
        .product-item { background: #111; padding: 10px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid var(--primary); display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        .product-item.is-agotado { border-left-color: #ff4444; opacity: 0.6; }
        .product-item img { width: 65px; height: 65px; object-fit: cover; border-radius: 12px; flex-shrink: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .product-info { flex: 1; min-width: 0; }
        .product-info h4 { margin: 0; font-size: 13px; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
        .product-info span { font-size: 10px; color: #666; display: block; margin-top: 2px; }
        
        .actions { display: flex; gap: 8px; margin-right: 2px; }
        .btn-action { padding: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; flex-shrink: 0; transition: 0.2s; }
        .btn-edit { background: #333; color: white; }
        .btn-stock { background: #222; border: 1px solid #444; color: #888; }
        .btn-stock.is-active { background: #222; color: var(--primary); border-color: var(--primary); }
        .btn-delete { background: rgba(255,68,68,0.2); color: #ff4444; border: 1px solid rgba(255,68,68,0.4); }
        
        .drag-handle { width: 30px; height: 40px; display: flex; align-items: center; justify-content: center; color: #333; cursor: grab; font-size: 18px; flex-shrink: 0; }
        .drag-handle:active { cursor: grabbing; color: var(--primary); }
        
        .btn-order { background: #222; color: #888; border: 1px solid #333; }
        .btn-order:hover { border-color: var(--primary); color: var(--primary); }
        .btn-order:disabled { opacity: 0.2; cursor: default; }

        .loader { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:none; justify-content:center; align-items:center; z-index:1000; flex-direction:column; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Estilos Galería Edición */
        .galeria-edicion { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; background: #000; padding: 10px; border-radius: 12px; }
        .thumb-edit { width: 90px; height: 90px; position: relative; border-radius: 8px; overflow: hidden; background: #222; }
        .thumb-edit img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-edit .btn-remove { position: absolute !important; top: 0 !important; right: 0 !important; left: auto !important; bottom: auto !important; background: #fff000 !important; color: #000 !important; border: none !important; width: 30px !important; height: 30px !important; border-radius: 0 8px 0 15px !important; display: flex !important; align-items: center !important; justify-content: center !important; font-size: 18px !important; cursor: pointer !important; z-index: 100 !important; font-weight: 900 !important; line-height: 1 !important; margin: 0 !important; box-shadow: 0 0 15px rgba(0,0,0,0.7) !important; }
        .thumb-edit .btn-remove:hover { background: #ff4444 !important; color: white !important; }
        
        .move-controls { position: absolute; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-between; background: rgba(0,0,0,0.6); }
        .btn-move { background: none; border: none; color: white; padding: 2px 8px; font-size: 12px; cursor: pointer; flex: 1; transition: 0.2s; margin: 0; }
        .btn-move:hover { background: var(--primary); color: #000; }
        .btn-move:disabled { opacity: 0.3; cursor: default; background: none; }

        /* Contenedor de Botones Flotantes */
        .floating-actions { position: fixed; bottom: 25px; right: 25px; display: none; gap: 10px; z-index: 1001; align-items: center; }
        
        #btn-guardar-orden { background: var(--primary); color: #000; font-weight: 700; padding: 12px 22px; border-radius: 12px; border: none; box-shadow: 0 10px 30px rgba(0,255,174,0.3); cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; width: auto; white-space: nowrap; }
        #btn-guardar-orden:hover { background: #fff; transform: translateY(-3px); }

        #btn-cancelar-orden { background: #222; color: #ff4444; font-weight: 700; padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255,68,68,0.3); cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        #btn-cancelar-orden:hover { background: #333; }

        /* Botón Ir al Final (Estilo Fantasma) */
        #btn-scroll-down { position: fixed; bottom: 70px; left: 20px; background: rgba(255,255,255,0.03); color: #444; width: 42px; height: 42px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; z-index: 1001; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); font-size: 18px; transition: 0.4s; }
        #btn-scroll-down.flash { background: var(--primary); color: #000; border-color: var(--primary); transform: scale(1.1); }

        .sortable-ghost { opacity: 0.4; background: var(--primary) !important; }

        /* Sistema de Notificaciones (Toast) */
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #111; color: #fff; padding: 12px 25px; border-radius: 50px; border: 1px solid var(--primary); box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 9999; font-size: 14px; transition: 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28); opacity: 0; pointer-events: none; white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div id="loader" class="loader">
    <div style="border: 4px solid var(--primary); border-top-color: transparent; width: 40px; height: 40px; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    <p>Procesando... ⏳</p>
</div>

<div id="toast" class="toast">Mensaje aquí</div>

<div class="container">
    <h1>PANEL DE GESTIÓN</h1>
    
    <button onclick="toggleConfig()" style="background:#222; color:#888; font-size:12px; padding:10px; margin-top:0; margin-bottom:15px;">Configurar Conexión ⚙️</button>
    <div id="config-box" class="config-box">
        <label>Token GitHub</label><input type="password" id="ghToken">
        <label>URL Apps Script</label><input type="text" id="gasUrl">
    </div>

    <input type="hidden" id="edit-id">
    <label>Nombre del Producto <small>(Máx 35 carácteres)</small></label><input type="text" id="nombre" maxlength="35">
    <label>Precio</label><input type="text" id="precio" placeholder="15.000">
    <label>Categoría</label>
    <select id="categoria">
        <option value="Auriculares">🎧 Auriculares</option>
        <option value="Accesorios">💻 Accesorios</option>
        <option value="Memorias">💾 Memorias</option>
        <option value="Parlantes">🔊 Parlantes</option>
    </select>
    <label>Fotos (Máx 5) <small style="color:#555">(Se subirán al final de tu galería)</small></label>
    <input type="file" id="foto" multiple accept="image/*" onchange="previsualizarNuevasFotos()">
    
    <div id="galeria-edicion" class="galeria-edicion" style="display:none;">
        <!-- Se llena solo al editar -->
    </div>

    <div id="edit-indicator" style="display:none; background:rgba(0,255,174,0.1); padding:10px; border-radius:8px; margin-top:10px; font-size:12px; color:var(--primary); text-align:center;">
        Editando producto... <span onclick="cancelarEdicion()" style="text-decoration:underline; cursor:pointer; margin-left:10px;">Cancelar</span>
    </div>

    <button id="btn-publicar" onclick="subirProducto()">PUBLICAR PRODUCTO</button>
</div>

<div class="product-list">
    <input type="text" id="busqueda-admin" placeholder="🔍 Buscar producto en el catálogo..." onkeyup="filtrarAdmin()" style="margin-bottom: 10px; border-color: rgba(0,255,174,0.3);">
    <h3>CATÁLOGO ACTUAL <small style="color:#555; font-weight:normal; font-size:11px;">(Arrastrá para reordenar)</small></h3>
    <div id="lista">Cargando lista...</div>
</div>

<div class="floating-actions" id="area-orden">
    <button id="btn-cancelar-orden" onclick="cancelarOrden()">✖ Cancelar</button>
    <button id="btn-guardar-orden" onclick="guardarNuevoOrden()">💾 GUARDAR ORDEN</button>
</div>

<button id="btn-scroll-down" onclick="toggleScroll()" title="Subir / Bajar">▼</button>

<script>
    const GH_USER = "juarez331";
    const GH_REPO = "Virtual.Admin";
    window.fotosEnEdicion = []; // Inicialización global necesaria

    window.onload = () => {
        document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
        document.getElementById('gasUrl').value = localStorage.getItem('gasUrl') || '';
        cargarLista();
    };

    function showToast(msg, duration = 3000) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), duration);
    }

    function toggleConfig() {
        const box = document.getElementById('config-box');
        if(box.style.display === "block") {
            localStorage.setItem('ghToken', document.getElementById('ghToken').value);
            localStorage.setItem('gasUrl', document.getElementById('gasUrl').value);
            box.style.display = "none";
            cargarLista();
        } else { box.style.display = "block"; }
    }

    async function cargarLista() {
        const url = localStorage.getItem('gasUrl');
        if(!url) { document.getElementById("lista").innerText = "Configura la URL para ver tus productos."; return; }
        try {
            const res = await fetch(url);
            const data = await res.json();
            window.productosCache = data.productos;
            renderizarLista(window.productosCache);
        } catch(e) { document.getElementById("lista").innerText = "Error al conectar con Google Sheets."; }
    }

    function filtrarAdmin() {
        const normalize = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        const rawTerm = document.getElementById("busqueda-admin").value.trim();
        const term = normalize(rawTerm);

        // Bloqueo de seguridad: Ocultar panel de guardado si hay filtro activo
        if (rawTerm !== "") {
            document.getElementById('area-orden').style.display = 'none';
        }

        const filtrados = window.productosCache.filter(p => {
            const nombre = normalize(p.Nombre || "");
            const categoria = normalize(p.Categoria || "");
            return nombre.includes(term) || categoria.includes(term);
        });
        renderizarLista(filtrados);
    }

    function renderizarLista(productos) {
        const lista = document.getElementById("lista");
        lista.innerHTML = "";
        
        // Destruir instancia previa de Sortable si existe
        if (window.sortableInstance) {
            window.sortableInstance.destroy();
            window.sortableInstance = null;
        }

        if (productos.length === 0) {
            lista.innerHTML = "<p style='text-align:center; color:#555; padding:20px;'>No se encontraron productos.</p>";
            return;
        }

        productos.forEach(p => {
            const agotado = p.Stock === "Agotado";
            lista.innerHTML += `
                <div class="product-item ${agotado?'is-agotado':''}" data-id="${p.ID}" id="item-${p.ID}">
                    <div class="drag-handle">☰</div>
                    <img src="${p.ImagenURL.split(',')[0]}">
                    <div class="product-info">
                        <h4>${p.Nombre}</h4>
                        <span style="color:#fff; font-size:11px; margin-top:2px;">$${p.Precio} <span style="color:#666; font-size:10px;">- ${p.Stock}</span></span>
                    </div>
                    <div class="actions">
                        <button class="btn-action btn-edit" title="Editar" onclick="prepararEdicion('${p.ID}')">✏️</button>
                        <button class="btn-action btn-stock ${agotado?'':'is-active'}" title="Stock" onclick="toggleStock('${p.ID}')">${agotado?'🚫':'📦'}</button>
                        <button class="btn-action btn-delete" title="Borrar" onclick="borrarProducto('${p.ID}')">🗑️</button>
                    </div>
                </div>
            `;
        });

        // Solo activar Sortable si NO hay búsqueda activa
        const term = document.getElementById("busqueda-admin").value.trim();
        if (term === "") {
            window.sortableInstance = new Sortable(lista, {
                animation: 150,
                handle: '.drag-handle',
                delay: 100,
                delayOnTouchOnly: true,
                ghostClass: 'sortable-ghost',
                onEnd: function() {
                    document.getElementById('area-orden').style.display = 'flex';
                }
            });
        }
        
        window.onscroll();
    }

    function cancelarOrden() {
        // Volvemos al orden original guardado en el caché sin recargar
        renderizarLista(window.productosCache);
        document.getElementById('area-orden').style.display = 'none';
        showToast("Cambios de orden cancelados ✖");
    }

    async function guardarNuevoOrden() {
        const term = document.getElementById("busqueda-admin").value.trim();
        if (term !== "") {
            showToast("⚠️ Borra el buscador antes de guardar");
            return;
        }

        const url = localStorage.getItem('gasUrl');
        if(!url) return;

        const ids = Array.from(document.querySelectorAll('#lista .product-item')).map(item => item.getAttribute('data-id'));
        
        document.getElementById('loader').style.display = 'flex';
        document.querySelector('#loader p').innerText = "Guardando nuevo orden... 💾";
        
        try {
            await fetch(url, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: "saveFullOrder", ids: ids }) 
            });
            showToast("¡Orden guardado perfectamente! 💾");
            setTimeout(() => location.reload(), 1500);
        } catch(e) {
            showToast("Error al guardar el orden ❌");
            document.getElementById('loader').style.display = 'none';
        }
    }

    // Lógica de Scroll Inteligente con Memoria
    let scrollDirection = "down"; 
    let lastScrollY = window.scrollY;

    window.onscroll = function() {
        const btn = document.getElementById('btn-scroll-down');
        if (!btn) return;

        const totalHeight = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        const windowHeight = window.innerHeight;
        const currentPos = window.scrollY;
        
        // Detectar dirección del movimiento
        const delta = currentPos - lastScrollY;
        lastScrollY = currentPos;

        // Si scrollea hacia arriba, la flecha apunta hacia ARRIBA
        if (delta < -5 && currentPos > 100) {
            scrollDirection = "up";
            btn.innerHTML = "▲";
        } 
        // Si scrollea hacia abajo, la flecha apunta hacia ABAJO
        else if (delta > 5) {
            scrollDirection = "down";
            btn.innerHTML = "▼";
        }

        // Límites absolutos (Primarios)
        if (currentPos < 50) {
            scrollDirection = "down";
            btn.innerHTML = "▼";
        } else if (currentPos + windowHeight >= totalHeight - 50) {
            scrollDirection = "up";
            btn.innerHTML = "▲";
        }
    };

    function toggleScroll() {
        const btn = document.getElementById('btn-scroll-down');
        const totalHeight = document.body.scrollHeight;

        // Efecto visual de destello
        btn.classList.add('flash');
        setTimeout(() => btn.classList.remove('flash'), 500);

        if (scrollDirection === "up") {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            window.scrollTo({ top: totalHeight, behavior: 'smooth' });
        }
    }

    function prepararEdicion(id) {
        const p = window.productosCache.find(item => item.ID.toString() === id.toString());
        if(!p) return;

        document.getElementById('edit-id').value = p.ID;
        document.getElementById('nombre').value = p.Nombre;
        document.getElementById('precio').value = p.Precio;
        document.getElementById('categoria').value = p.Categoria || 'General';
        document.getElementById('btn-publicar').innerText = "GUARDAR CAMBIOS";
        document.getElementById('edit-indicator').style.display = "block";
        document.getElementById('foto').value = ""; // Limpiar input archivos
        
        // Cargamos las fotos actuales como objetos
        window.fotosEnEdicion = (p.ImagenURL ? p.ImagenURL.split(',') : []).map(url => ({
            type: 'url',
            src: url,
            file: null
        }));
        renderGaleriaEdicion();

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function previsualizarNuevasFotos() {
        const input = document.getElementById('foto');
        const files = Array.from(input.files);
        
        if (window.fotosEnEdicion.length + files.length > 5) {
            showToast("Máximo 5 fotos permitidas 📸");
            input.value = "";
            return;
        }

        for (let file of files) {
            const src = URL.createObjectURL(file);
            window.fotosEnEdicion.push({
                type: 'file',
                src: src, // Preview URL
                file: file // Objeto File real para subir
            });
        }
        renderGaleriaEdicion();
    }

    function renderGaleriaEdicion() {
        const ga = document.getElementById("galeria-edicion");
        if(window.fotosEnEdicion.length === 0) { ga.style.display = "none"; return; }
        
        ga.style.display = "flex";
        ga.innerHTML = window.fotosEnEdicion.map((item, i) => `
            <div class="thumb-edit">
                <img src="${item.src}">
                <button class="btn-remove" onclick="quitarFoto(${i})">✕</button>
                <div class="move-controls">
                    <button class="btn-move" onclick="moverFoto(${i}, -1)" ${i===0?'disabled':''}>◀</button>
                    <button class="btn-move" onclick="moverFoto(${i}, 1)" ${i===window.fotosEnEdicion.length-1?'disabled':''}>▶</button>
                </div>
            </div>
        `).join('');
    }

    function moverFoto(idx, step) {
        const target = idx + step;
        if (target < 0 || target >= window.fotosEnEdicion.length) return;
        const temp = window.fotosEnEdicion[idx];
        window.fotosEnEdicion[idx] = window.fotosEnEdicion[target];
        window.fotosEnEdicion[target] = temp;
        renderGaleriaEdicion();
    }

    function quitarFoto(idx) {
        const item = window.fotosEnEdicion[idx];
        if (item.type === 'file') URL.revokeObjectURL(item.src); // Liberar memoria
        window.fotosEnEdicion.splice(idx, 1);
        renderGaleriaEdicion();
    }

    function cancelarEdicion() {
        document.getElementById('edit-id').value = "";
        document.getElementById('nombre').value = "";
        document.getElementById('precio').value = "";
        document.getElementById('foto').value = "";
        document.getElementById('btn-publicar').innerText = "PUBLICAR PRODUCTO";
        document.getElementById('edit-indicator').style.display = "none";
        document.getElementById('galeria-edicion').style.display = "none";
        // Liberar blobs de memoria
        window.fotosEnEdicion.forEach(item => { if(item.type==='file') URL.revokeObjectURL(item.src); });
        window.fotosEnEdicion = [];
    }

    async function subirProducto() {
        const editId = document.getElementById('edit-id').value;
        const t = document.getElementById('ghToken').value;
        const g = document.getElementById('gasUrl').value;
        const n = document.getElementById('nombre').value;
        const p = document.getElementById('precio').value;

        if(!t || !g || !n || !p || window.fotosEnEdicion.length === 0) {
            showToast("⚠️ Completa los datos y fotos");
            return;
        }

        document.getElementById('loader').style.display = 'flex';
        document.querySelector('#loader p').innerText = "Guardando producto y subiendo fotos... ⏳";
        
        try {
            const finalUrls = [];
            
            for (let item of window.fotosEnEdicion) {
                if (item.type === 'url') {
                    // Si ya existe, la mantenemos
                    finalUrls.push(item.src);
                } else {
                    // Si es nueva, la subimos a GitHub
                    const b = await new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(item.file); });
                    const path = `fotos/img_${Date.now()}_${Math.random().toString(36).substr(2,3)}.png`;
                    await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}`, {
                        method: 'PUT', headers: { 'Authorization': `Bearer ${t}` },
                        body: JSON.stringify({ message: "Nueva Foto", content: b.split(',')[1] })
                    });
                    finalUrls.push(`https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/${path}`);
                }
            }

            const urlsString = finalUrls.slice(0, 5).join(",");

            const payload = { 
                action: editId ? "updateProducto" : "addProducto", 
                data: { Nombre: n, Categoria: document.getElementById('categoria').value, Precio: p, ImagenURL: urlsString }
            };
            if(editId) payload.id = editId;

            await fetch(g, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload)});
            
            showToast(editId ? "¡Producto Actualizado! ✅" : "¡Producto Publicado! 🚀");
            setTimeout(() => location.reload(), 1500);
        } catch(e) { 
            showToast("Error en el servidor ❌"); 
            document.getElementById('loader').style.display = 'none';
        }
    }

    async function borrarProducto(id) {
        if(!confirm("¿Seguro que quieres borrar este producto?")) return;
        const g = localStorage.getItem('gasUrl');
        if(!g) return showToast("Falta URL Apps Script ⚠️");
        
        document.getElementById('loader').style.display = 'flex';
        try {
            await fetch(g, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: "deleteProducto", id: id }) 
            });
            showToast("Producto eliminado 🗑️");
            setTimeout(() => location.reload(), 2000);
        } catch(e) { 
            showToast("Error al conectar ❌");
            document.getElementById('loader').style.display = 'none';
        }
    }

    async function reordenarCatalogo(id, direction) {
        const url = localStorage.getItem('gasUrl');
        if(!url) return;

        // Mostrar indicador de carga "Cambiando orden..."
        const item = document.getElementById(`item-${id}`);
        const info = item.querySelector('.product-info h4');
        const oldText = info.innerText;
        info.innerText = "Cambiando orden... ⏳";
        
        try {
            await fetch(url, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: "reorderProducto", id: id, direction: direction }) 
            });
            // Pequeña espera para sincronización del Excel
            setTimeout(() => { cargarLista(); }, 1500);
        } catch(e) {
            info.innerText = oldText;
            showToast("Error al mover el producto ❌");
        }
    }

    async function toggleStock(id) {
        const g = localStorage.getItem('gasUrl');
        if(!g) return showToast("Falta URL Apps Script ⚠️");
        
        document.getElementById('loader').style.display = 'flex';
        try {
            await fetch(g, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: "toggleStock", id: id }) 
            });
            showToast("Stock actualizado 📦");
            setTimeout(() => location.reload(), 2000);
        } catch(e) { 
            showToast("Error al cambiar stock ❌");
            document.getElementById('loader').style.display = 'none';
        }
    }
</script>
</body>
</html>
