<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Virtual Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ffae; --bg: #0b0b0b; --card: rgba(25, 25, 25, 0.95); }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .container { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); width: 100%; max-width: 450px; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        
        /* Botón de Configuración */
        .config-toggle { position: absolute; top: 20px; right: 20px; cursor: pointer; color: #555; transition: 0.3s; font-size: 20px; }
        .config-toggle:hover { color: var(--primary); transform: rotate(45deg); }

        #config-section { display: none; background: #000; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px dashed #333; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 20px; text-align: center; color: var(--primary); letter-spacing: 2px; margin-top: 0; }
        label { display: block; margin-top: 15px; font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: 1px; }
        
        input, select, textarea { width: 100%; padding: 12px; margin-top: 6px; background: rgba(0,0,0,0.5); border: 1px solid #333; border-radius: 10px; color: white; font-family: inherit; box-sizing: border-box; }
        input:focus { border-color: var(--primary); outline: none; }

        .image-box { width: 100%; height: 200px; border: 2px dashed #333; border-radius: 15px; margin-top: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; overflow: hidden; }
        #preview { width: 100%; height: 100%; object-fit: cover; display: none; }
        .image-box span { color: #555; font-size: 14px; }

        button { width: 100%; padding: 16px; margin-top: 30px; background: var(--primary); color: black; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,255,174,0.2); }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(0,255,174,0.4); }

        .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; flex-direction: column; }
    </style>
</head>
<body>

<div id="loader" class="loader"><div style="border: 4px solid var(--primary); border-top-color: transparent; width: 40px; height: 40px; border-radius: 50%; animation: spin 0.8s linear infinite;"></div><p>Publicando...</p></div>

<div class="container">
    <div class="config-toggle" onclick="toggleConfig()">⚙️</div>
    <h1>NUEVO PRODUCTO</h1>

    <!-- Sección Config (Oculta por defecto) -->
    <div id="config-section">
        <label>GitHub Token</label><input type="password" id="ghToken" placeholder="ghp_...">
        <label>URL Apps Script</label><input type="text" id="gasUrl" placeholder="https://script.google.com/...">
        <p style="font-size: 10px; color: #555; text-align: center; margin-top: 10px;">Presiona el engranaje para guardar/cerrar</p>
    </div>

    <!-- Formulario Principal -->
    <label>Nombre del Producto</label><input type="text" id="nombre" placeholder="Ej: Auriculares Pro">
    
    <label>Categoría</label>
    <select id="categoria">
        <option value="Auriculares">🎧 Auriculares</option>
        <option value="Accesorios">💻 Accesorios</option>
        <option value="Memorias">💾 Memorias</option>
    </select>

    <label>Precio</label><input type="text" id="precio" placeholder="15.000">
    <label>Descripción</label><textarea id="descripcion" rows="2"></textarea>

    <label>Foto</label>
    <div class="image-box" onclick="document.getElementById('foto').click()">
        <span id="placeholder-text">Toca para elegir foto</span>
        <img id="preview">
    </div>
    <input type="file" id="foto" accept="image/*" capture="environment" style="display: none;">

    <button onclick="subir()">PUBLICAR EN LA TIENDA</button>
</div>

<script>
    const GH_USER = "juarez331"; 
    const GH_REPO = "Virtual.Admin";

    window.onload = () => {
        document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
        document.getElementById('gasUrl').value = localStorage.getItem('gasUrl') || '';
    };

    function toggleConfig() {
        const sec = document.getElementById('config-section');
        if(sec.style.display === "block") {
            localStorage.setItem('ghToken', document.getElementById('ghToken').value);
            localStorage.setItem('gasUrl', document.getElementById('gasUrl').value);
            sec.style.display = "none";
        } else {
            sec.style.display = "block";
        }
    }

    document.getElementById('foto').onchange = (e) => {
        const r = new FileReader(); 
        r.onload = () => { 
            document.getElementById('preview').src = r.result; 
            document.getElementById('preview').style.display = 'block'; 
            document.getElementById('placeholder-text').style.display = 'none';
        };
        r.readAsDataURL(e.target.files[0]);
    };

    async function subir() {
        const t = document.getElementById('ghToken').value;
        const g = document.getElementById('gasUrl').value;
        const n = document.getElementById('nombre').value;
        const p = document.getElementById('precio').value;
        const f = document.getElementById('foto').files[0];

        if (!t || !g || !n || !p || !f) return alert("Faltan datos obligatorios.");

        document.getElementById('loader').style.display = 'flex';

        try {
            const b = await new Promise((r) => { const reader = new FileReader(); reader.onload = () => r(reader.result); reader.readAsDataURL(f); });
            const path = `fotos/img_${Date.now()}.png`;

            // Subir a GitHub
            const resGh = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}`, {
                method: 'PUT', headers: { 'Authorization': `Bearer ${t}` },
                body: JSON.stringify({ message: "Foto", content: b.split(',')[1] })
            });

            if (!resGh.ok) throw new Error("Error subiendo imagen a GitHub.");
            const url = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/${path}`;

            // Guardar en Google Sheets
            await fetch(g, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "addProducto", data: { Nombre: n, Categoria: document.getElementById('categoria').value, Precio: p, Descripcion: document.getElementById('descripcion').value, ImagenURL: url } })});

            alert("¡Producto publicado correctamente!");
            location.reload();
        } catch (e) { alert("Error: " + e.message); }
        finally { document.getElementById('loader').style.display = 'none'; }
    }
</script>
<style> @keyframes spin { 100% { transform: rotate(360deg); } } </style>
</body>
</html>
