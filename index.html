<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Store - Resistencia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ffae;
            --bg: #0b0b0b;
            --card-bg: rgba(30, 30, 30, 0.6);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: white;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 174, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 174, 0.05) 0%, transparent 40%);
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(to bottom, #000, transparent);
        }

        header img { width: 180px; filter: drop-shadow(0 0 10px rgba(0,255,174,0.3)); }
        header p { color: #888; font-size: 14px; letter-spacing: 1px; }

        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 0 40px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0, 255, 174, 0.15);
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .info { padding: 25px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .info h3 { margin: 0; font-size: 18px; font-weight: 600; }
        .info p { color: #aaa; font-size: 13px; margin: 10px 0; line-height: 1.5; }

        .precio {
            color: var(--primary);
            font-size: 26px;
            font-weight: 700;
            margin: 15px 0;
            text-shadow: 0 0 10px rgba(0,255,174,0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            background: var(--primary);
            color: #000;
            font-weight: 700;
            font-size: 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #fff;
            transform: scale(1.02);
        }

        #loader {
            text-align: center;
            padding: 100px 20px;
            font-size: 18px;
            color: #555;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0,255,174,0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .productos { padding: 0 20px 40px; gap: 20px; }
            header { padding: 40px 20px; }
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Virtual Store" onerror="this.style.display='none'">
        <h1 style="color:var(--primary); margin:10px 0 5px; font-weight:600;">VIRTUAL STORE</h1>
        <p>Elegís, comprás y lo enviamos a tu domicilio.</p>
    </header>

    <div id="loader">
        <div class="spinner"></div>
        Cargando productos seleccionados...
    </div>

    <section id="lista-productos" class="productos"></section>

    <script>
        // URL Corregida (con comillas y activa)
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwyniMtJ5cvzHA9KjrqK7hbBgiSvIjIPMMUoF3TUbkU4tOo3bdyPwinZo04Wyuh4U0/exec";

        async function cargarTienda() {
            try {
                // Fetch con seguimiento de redirección para Google Apps Script
                const res = await fetch(GAS_URL, { redirect: "follow" });
                const data = await res.json();
                
                const lista = document.getElementById("lista-productos");
                const loader = document.getElementById("loader");
                
                loader.style.display = "none";

                if (!data.productos || data.productos.length === 0) {
                    loader.innerHTML = "No hay productos disponibles en este momento.";
                    loader.style.display = "block";
                    return;
                }

                data.productos.forEach(p => {
                    lista.innerHTML += `
                        <div class="card">
                            <img src="${p.ImagenURL}" onerror="this.src='https://via.placeholder.com/300x300?text=Sin+Imagen'">
                            <div class="info">
                                <div>
                                    <h3>${p.Nombre}</h3>
                                    <p>${p.Descripcion || ''}</p>
                                </div>
                                <div>
                                    <div class="precio">$${p.Precio}</div>
                                    <button onclick="pedir('${p.Nombre}', '${p.Precio}')">Comprar por WhatsApp</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) { 
                console.error("Error cargando tienda:", e);
                document.getElementById("loader").innerHTML = "Error al conectar con la base de datos.<br><small>Verifica la configuración del Apps Script.</small>";
            }
        }

        function pedir(nombre, precio) {
            const telefono = "5493624744142";
            const mensaje = encodeURIComponent(`Hola! Me interesa el producto: *${nombre}* ($${precio}). ¿Tienen stock disponible?`);
            const url = `https://wa.me/${telefono}?text=${mensaje}`;
            window.open(url, '_blank');
        }

        // Iniciar carga
        cargarTienda();
    </script>
</body>
</html>
